spring.application.name=end

# Comma separated, override with APP_CORS_ALLOWED_ORIGINS when running in containers.
app.cors.allowed-origins=http://localhost:3000,http://localhost:3001

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

# MCP server. The transport is served at /mcp and the annotation scanner
# discovers @McpTool methods on any bean, no extra registration needed.
# protocol must be set explicitly: the auto-configuration is gated on the
# property being present, not on the properties class default.
spring.ai.mcp.server.protocol=STATELESS
spring.ai.mcp.server.name=pokemon-effectiveness
spring.ai.mcp.server.version=0.0.1
spring.ai.mcp.server.instructions=Tools for Pokemon type effectiveness. Types are lowercase names such as fire, water or flying.
