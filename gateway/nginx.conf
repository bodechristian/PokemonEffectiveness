# Stands in for a Kubernetes Ingress: one public entry point that path-routes to
# the frontend and the end service, so the browser only ever sees one origin and
# CORS never enters the picture.

upstream frontend {
    server frontend:3000;
}

upstream end {
    server end:8080;
}

server {
    listen 80;
    server_name _;

    # The API. The trailing slash on proxy_pass strips the /api prefix, so
    # /api/effectiveness reaches the end service as /effectiveness.
    location /api/ {
        proxy_pass http://end/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The MCP server. Streamable HTTP answers with server-sent events, so
    # buffering has to be off or responses arrive in chunks, late or never.
    location /mcp {
        proxy_pass http://end;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else is the Nuxt app, including its server-rendered pages,
    # client bundle and HMR-free production assets.
    location / {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
    }
}
