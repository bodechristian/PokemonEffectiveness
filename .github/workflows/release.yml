name: Create Release with Executable

on:
  push:
    tags:
      - 'v*'  # Triggers on tags like v1.0.0, v2.1.3, etc.

jobs:
  build-and-release:
    runs-on: windows-latest
    
    permissions:
      contents: write  # Required to create releases
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'  # Eclipse Temurin includes jpackage
      
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
      
      - name: Build JAR and create executable
        run: ./gradlew createExe --no-daemon
      
      - name: Zip the executable
        run: |
          cd build/jpackage/PokemonTypeCalculator
          Compress-Archive -Path * -DestinationPath ../PokemonTypeCalculator-windows.zip
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: build/jpackage/PokemonTypeCalculator-windows.zip
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
