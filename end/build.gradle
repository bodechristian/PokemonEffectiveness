plugins {
    id 'java-conventions'
    id 'openapi-conventions'
}

group = 'com.middle'
version = '0.0.1-SNAPSHOT'
description = 'middleend'

javaConventions {
    javaVersion = 21
}

openapiConventions {
    serverUrl = 'http://localhost:8080'
}

dependencies {
    // Kubernetes liveness/readiness probes
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // MCP server over Streamable HTTP. 2.0.x is the Spring Boot 4 line.
    implementation platform('org.springframework.ai:spring-ai-bom:2.0.1')
    implementation 'org.springframework.ai:spring-ai-starter-mcp-server-webmvc'
}

openApiGenerate {
    generatorName = "spring"
    inputSpec = "$rootDir/api/openapi.yaml"
    outputDir = layout.buildDirectory.dir("generated").get().asFile.absolutePath
    apiPackage = "com.middle.end.api"
    modelPackage = "com.middle.end.api.model"
    configOptions = [
            interfaceOnly  : "true",
            openApiNullable: "false",
            useSpringBoot3: "true",
            skipDefaultInterface: "true"
    ]
}
compileJava.dependsOn tasks.openApiGenerate

sourceSets {
    main {
        java {
            srcDir layout.buildDirectory.dir("generated/src/main/java")
        }
    }
}
