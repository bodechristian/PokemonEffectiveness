plugins {
    id 'java'
}

group = 'org.example'
version = '1.0-SNAPSHOT'

jar {
    manifest {
        attributes(
            'Main-Class': 'org.example.Main'
        )
    }
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform(libs.junit.bom)
    testImplementation libs.junit.jupiter
    testRuntimeOnly libs.junit.platform.launcher
}

test {
    useJUnitPlatform()
}

tasks.register('runJar') {
    group = 'application'
    description = 'Builds and runs the application JAR in a separate process (non-blocking)'
    
    dependsOn 'jar'
    
    doLast {
        def jarFile = jar.archiveFile.get().asFile
        
        println "Starting application: ${jarFile.name}"
        println "JAR location: ${jarFile.absolutePath}"
        
        def processBuilder = new ProcessBuilder(
            'javaw', '-jar', jarFile.absolutePath
        )
        processBuilder.directory(project.projectDir)

        try {
            processBuilder.start()
            println "Application launched!"
        } catch (IOException e) {
            throw new GradleException("Failed to start application: ${e.message}", e)
        }
    }
}

tasks.register('createExe', Exec) {
    group = 'distribution'
    description = 'Creates a Windows .exe using jpackage (Windows only)'

    dependsOn jar

    onlyIf {
        org.gradle.internal.os.OperatingSystem.current().isWindows()
    }

    def jarFile = jar.archiveFile.get().asFile
    def outputDir = layout.buildDirectory.dir('jpackage').get().asFile
    def appName = 'PokemonTypeCalculator'

    inputs.file(jarFile)
    outputs.dir(outputDir)

    doFirst {
        def javaHome = System.getProperty("java.home")
        def jpackageExe = new File(javaHome, 'bin/jpackage.exe')

        if (!jpackageExe.exists()) {
            throw new GradleException(
                    "jpackage not found at ${jpackageExe.absolutePath}\n" +
                            "Requires JDK 14+ (not JRE). Current Java home: ${javaHome}"
            )
        }

        outputDir.deleteDir()
        outputDir.mkdirs()

        println "Creating Windows executable with jpackage..."
        println "JDK: ${javaHome}"
        println "jpackage: ${jpackageExe.absolutePath}"
        println "JAR: ${jarFile.absolutePath}"
        println "Output: ${outputDir.absolutePath}"
        println ""

        commandLine jpackageExe.absolutePath,
                '--type', 'app-image',
                '--input', jarFile.parent,
                '--name', appName,
                '--main-jar', jarFile.name,
                '--main-class', 'org.example.Main',
                '--dest', outputDir.absolutePath,
                '--app-version', '1.0',
                '--description', 'Pokemon Type Effectiveness Calculator',
                '--vendor', 'Example'
    }

    doLast {
        def exePath = new File(outputDir, "${appName}/${appName}.exe")
        println "You can now run: ${exePath.absolutePath}"
    }
}

